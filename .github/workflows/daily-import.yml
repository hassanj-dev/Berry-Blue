name: Daily import

on:
  schedule:
    # Every day at 02:17 UTC. GitHub may start it a few minutes late.
    - cron: "17 2 * * *"
  # Lets you run it by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Import catalog
        run: pnpm --filter @berryblue/worker exec tsx src/import.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      - name: Process thumbnails
        run: pnpm --filter @berryblue/worker exec tsx src/process-thumbnails.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
