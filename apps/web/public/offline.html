<style>

<body>
<header>
  <span class="brand"><img class="logo-white" src="/brand/wordmark-white.png" alt="BerryBlue" height="36"><img class="logo-blue" src="/brand/wordmark-blue.png" alt="BerryBlue" height="26"></span>

<main>
  <section class="intro">

  </span>
  <h1>Oops! You’re offline</h1>
    <p class="lead">Looks like your internet took a little break. Check your connection and try again.</p>
    <button id="retry" class="btn" type="button">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>

  </section>

    <div class="hint"><span>Space, Arrow Up or tap to jump</span></div>
  </section>
</main>
<script>
(function(){

}

/* ---------- drawing helpers ---------- */

 var P=[[-26,-8,8],[-14,-14,12],[2,-20,17],[20,-15,13],[30,-8,8],[2,-9,9],[-8,-8,8],[16,-7,8]];

 ctx.fillStyle=lg(0,-12,0,2,[0,"rgba(110,128,185,0)",1,dk?"rgba(28,34,90,.6)":"rgba(120,140,195,.5)"]);ctx.fillRect(-40,-12,90,16);
 ctx.restore();ctx.restore()}

 ctx.save();ctx.translate(PX+14,G-pl.y-bob);ctx.scale(1+sq*.16,1-sq*.16);if(dead)ctx.rotate(.22);else if(air)ctx.rotate(-.07);
 ctx.lineWidth=1;ctx.strokeStyle="rgba(124,134,208,.55)";ctx.lineCap="round";

 [[-9+leg,"#d3d8f5"],[3-leg,"#e6e9fc"]].forEach(function(l){ctx.fillStyle=lg(l[0],-9,l[0]+8,2,[0,"#f8f9ff",1,l[1]]);rr(l[0],-9,8,11,4);ctx.stroke();ctx.fillStyle="#ffb3c9";e(l[0]+4,-1,2.6,1.8)});
 ctx.fillStyle=fur(-14,-20,4.6);blob(-14,-20,4.6,4.6);

 [-11,12].forEach(function(x){ctx.fillStyle=fur(x,-55+ea,6.2);blob(x,-55+ea,6.2,6.2);ctx.fillStyle=rg(x,-54.5+ea,.5,x,-54.5+ea,3.6,[0,"#ffcadb",1,"#f08fb0"]);e(x,-54.5+ea,3.3,3.3)});

 ctx.fillStyle=lg(0,-31,0,-19,[0,"#7683ff",1,"#2631c8"]);ctx.beginPath();ctx.moveTo(-10,-31);ctx.quadraticCurveTo(1,-24,12,-31);ctx.lineTo(11,-26);ctx.quadraticCurveTo(1,-19,-9,-26);ctx.closePath();ctx.fill();e(8,-23,3,4.5,-.3);
 ctx.strokeStyle="rgba(255,255,255,.4)";ctx.lineWidth=.9;ctx.beginPath();ctx.moveTo(-8,-29.5);ctx.quadraticCurveTo(1,-23.5,10,-29.5);ctx.stroke();
 ctx.fillStyle=rg(4,-40,.5,5,-38.5,8,[0,"#fffdf8",1,"#e6e9ff"]);e(5,-38.5,6.8,5.2);ctx.fillStyle="rgba(255,140,175,.5)";e(-6,-39,3,2);e(15,-39,3,2);
 ctx.strokeStyle="#262a55";ctx.lineWidth=1.4;
 if(dead||clock%3.6<.13){ctx.beginPath();[-1.5,11.5].forEach(function(x){if(dead){ctx.moveTo(x-2,-47);ctx.lineTo(x+2,-43);ctx.moveTo(x+2,-47);ctx.lineTo(x-2,-43)}else{ctx.moveTo(x-2,-45);ctx.lineTo(x+2,-45)}});ctx.stroke()}
